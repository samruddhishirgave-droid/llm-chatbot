<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Buddy</title>
<style>
  body{font-family:sans-serif;max-width:600px;margin:20px auto;padding:0 10px}
  #chat{border:1px solid #ccc;height:400px;overflow-y:auto;padding:10px;border-radius:8px}
  .user{text-align:right;color:#0b57d0;margin:6px 0}
  .bot{text-align:left;color:#222;margin:6px 0}
  .err{color:#c00;margin:6px 0}
  #row{display:flex;gap:6px;margin-top:10px}
  #msg{flex:1;padding:10px}
</style>
</head>
<body>
<h2>📚 Study Buddy</h2>
<div id="chat"></div>
<div id="row">
  <input id="msg" placeholder="Type your question..." />
  <button onclick="send()" id="btn">Send</button>
  <button onclick="resetChat()">New chat</button>
</div>
<script>
let cid = null;
const chat = document.getElementById("chat");
const msg = document.getElementById("msg");
msg.addEventListener("keydown", e => { if(e.key==="Enter") send(); });

function add(cls, text){
  const d = document.createElement("div");
  d.className = cls; d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}

async function send(){
  const text = msg.value.trim();
  if(!text) return;
  add("user", text); msg.value = "";
  document.getElementById("btn").disabled = true;
  const wait = add("bot", "Thinking...");
  try{
    const res = await fetch("/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message:text, conversation_id:cid})
    });
    const data = await res.json();
    wait.remove();
    if(!res.ok) add("err", data.error || "Something went wrong.");
    else { cid = data.conversation_id; add("bot", data.reply); }
  }catch(e){
    wait.remove();
    add("err", "Could not connect to the server.");
  }
  document.getElementById("btn").disabled = false;
  msg.focus();
}

async function resetChat(){
  await fetch("/reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({conversation_id:cid})});
  cid = null; chat.innerHTML = "";
}
</script>
</body>
</html>
